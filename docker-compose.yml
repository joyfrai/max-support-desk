services:
  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8066:8000"
    volumes:
      - media:/app/media
    depends_on:
      redis:
        condition: service_healthy
    command: daphne -b 0.0.0.0 -p 8000 max_support_desk.asgi:application

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media:/app/media
    depends_on:
      redis:
        condition: service_healthy
    command: python manage.py send_queued_messages

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  media:
  redis_data:
