services:
  web:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
    volumes:
      - media:/app/media
    depends_on:
      redis:
        condition: service_healthy
    command: daphne -b 127.0.0.1 -p 8066 max_support_desk.asgi:application

  worker:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
    volumes:
      - media:/app/media
    depends_on:
      redis:
        condition: service_healthy
    command: python manage.py send_queued_messages

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  media:
  redis_data:
