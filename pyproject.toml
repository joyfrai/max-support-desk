[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "max-support-desk"
version = "0.1.0"
description = "Self-hosted MAX support desk on Django and Chatscope"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<5.3",
    "channels>=4.1,<5",
    "channels-redis>=4.2,<5",
    "daphne>=4.1,<5",
    "django-unfold>=0.69",
    "httpx>=0.27,<1",
    "mysqlclient>=2.2,<3",
    "whitenoise>=6.7,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-django>=4.8,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["max_support_desk*", "support*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "max_support_desk.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["support/tests"]
